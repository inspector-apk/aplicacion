name: Build iOS IPA (sin firmar)

# Solo se dispara manualmente desde la pestaña "Actions" en GitHub, para
# no gastar minutos de runner macOS en cada commit.
on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar el proyecto nativo de iOS
        run: flutter create --platforms=ios --org com.inspector --project-name inspector .

      - name: Agregar permisos a Info.plist (ubicación, cámara, fotos, micrófono)
        run: |
          plutil -insert NSLocationWhenInUseUsageDescription -string "Inspector usa tu ubicación para mostrarte el mapa y conectar solicitudes cercanas en Bogotá." ios/Runner/Info.plist
          plutil -insert NSCameraUsageDescription -string "Inspector necesita la cámara para que los colaboradores tomen fotos y videos al responder solicitudes." ios/Runner/Info.plist
          plutil -insert NSPhotoLibraryUsageDescription -string "Inspector necesita acceso a tus fotos para adjuntar imágenes y videos al responder solicitudes." ios/Runner/Info.plist
          plutil -insert NSMicrophoneUsageDescription -string "Inspector necesita el micrófono para que los colaboradores graben notas de audio o video al responder solicitudes." ios/Runner/Info.plist

      - name: Permitir HTTP sin cifrar hacia el backend (ATS)
        run: |
          plutil -insert NSAppTransportSecurity -json '{
            "NSExceptionDomains": {
              "appinspector.servialco.com": {
                "NSExceptionAllowsInsecureHTTPLoads": true,
                "NSIncludesSubdomains": false
              }
            }
          }' ios/Runner/Info.plist

      - name: Detectar capturas de pantalla (iOS no permite bloquearlas)
        run: |
          cat > ios/Runner/AppDelegate.swift << 'EOF'
          import Flutter
          import UIKit

          // Apple no permite a ninguna app bloquear la captura de pantalla
          // del sistema (a diferencia de Android). Lo único posible es
          // detectar cuando ocurrió y avisarle a la propia app, para que
          // muestre una alerta — disuasivo, no preventivo.
          @main
          @objc class AppDelegate: FlutterAppDelegate {
            override func application(
              _ application: UIApplication,
              didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
            ) -> Bool {
              GeneratedPluginRegistrant.register(with: self)

              if let controller = window?.rootViewController as? FlutterViewController {
                let canal = FlutterMethodChannel(
                  name: "inspector/capturas",
                  binaryMessenger: controller.binaryMessenger
                )
                NotificationCenter.default.addObserver(
                  forName: UIApplication.userDidTakeScreenshotNotification,
                  object: nil,
                  queue: .main
                ) { _ in
                  canal.invokeMethod("capturaDetectada", arguments: nil)
                }
              }

              return super.application(application, didFinishLaunchingWithOptions: launchOptions)
            }
          }
          EOF

      - name: Generar el ícono de la app
        run: dart run flutter_launcher_icons -f icons_config_ios.yaml

      - name: Compilar la app de iOS (sin firmar)
        run: flutter build ios --release --no-codesign --dart-define=INSPECTOR_API_KEY=${{ secrets.INSPECTOR_API_KEY }}

      - name: Empaquetar como .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Inspector-unsigned.ipa Payload

      - name: Subir el .ipa como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Inspector-unsigned-ipa
          path: Inspector-unsigned.ipa
          retention-days: 14
